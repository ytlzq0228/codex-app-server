{% if identity.password_hash %}
<section class="panel">
  <div class="section-head account-security">
    <div><h2>账户安全</h2><p class="muted">修改登录密码后，其他登录会话将失效。</p></div>
    <button {% if loading %}disabled{% endif %} type="button" class="button" data-modal-open="account-password-dialog">修改密码</button>
  </div>
  <dialog id="account-password-dialog" class="app-modal" data-password-dialog aria-labelledby="account-password-title">
    <div class="dialog-head"><h2 id="account-password-title">修改密码</h2><button {% if loading %}disabled{% endif %} type="button" class="icon-button" data-modal-close aria-label="关闭">×</button></div>
    <form data-portal data-password action="/user/account/password" method="post" class="stack-form">
      {{ csrf() }}
      <label>当前密码<input {% if loading %}disabled{% endif %} type="password" name="current_password" autocomplete="current-password" required autofocus></label>
      <label>新密码（至少 12 位）<input {% if loading %}disabled{% endif %} type="password" name="new_password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
      <label>确认新密码<input {% if loading %}disabled{% endif %} type="password" name="confirm_password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
      <p data-form-error role="alert" hidden></p>
      <div class="dialog-actions"><button {% if loading %}disabled{% endif %} type="button" class="button" data-modal-close>取消</button><button {% if loading %}disabled{% endif %} type="submit" class="button button-primary">保存密码</button></div>
    </form>
  </dialog>
</section>
{% endif %}
