<section class="panel">
<h2>{{ t('API 调试') }}</h2><p>{{ t('使用你的 Key 调用本站 API。请求经过正常认证、调度和用量记录；流式响应会实时显示。Key 仅保留在当前页面。') }}</p>
<form id="debug-form" class="stack-form">
<label>{{ t('API Key') }}<input {% if loading %}disabled{% endif %} type="password" name="key" autocomplete="off" required></label>
<label>{{ t('接口') }}<select {% if loading %}disabled{% endif %} name="endpoint"><option value="/v1/responses">{{ t('Responses') }}</option><option value="/v1/chat/completions">{{ t('Chat Completions') }}</option><option value="/v1/messages">{{ t('Claude · Messages') }}</option><option value="/v1/messages/count_tokens">{{ t('Claude · Token 估算') }}</option><option value="/v1/models">{{ t('查询模型') }}</option></select></label>
<label>{{ t('可用模型') }}<select {% if loading %}disabled{% endif %} name="model"><option value="">{{ t('选择模型') }}</option>{% for model in debug_models %}<option value="{{ model.id }}" data-provider="{{ model.provider }}">{{ model.id }} · {{ model.provider }}</option>{% endfor %}</select></label>
<p class="muted">{{ t('模型按当前账号权限显示；请求仍以填写的 Key 权限为准。没有可选模型时，请贡献对应厂商的 Worker 或联系管理员授权并配置模型。') }}</p>
<label><input {% if loading %}disabled{% endif %} type="checkbox" name="stream">{{ t('流式响应') }}</label><button {% if loading %}disabled{% endif %} type="button" id="debug-example" class="button">{{ t('填入请求示例') }}</button>
<p id="debug-help" class="muted"></p><label id="debug-body-label">{{ t('请求 JSON') }}<textarea {% if loading %}disabled{% endif %} name="body" rows="12" spellcheck="false"></textarea></label>
<div class="row-actions"><button {% if loading %}disabled{% endif %} type="submit" class="button button-primary">{{ t('发送请求') }}</button><button {% if loading %}disabled{% endif %} type="button" id="debug-stop" class="button" disabled>{{ t('停止请求') }}</button></div>
</form><p id="debug-status" role="status" aria-live="polite"></p><pre id="debug-headers"></pre><pre id="debug-output" tabindex="0" aria-label="{{ t('API 响应') }}"></pre>
</section>
{% include 'shared/client-setup.html' %}
{% if not loading %}<script src="/static/debug.js?v=1" defer></script>{% endif %}
