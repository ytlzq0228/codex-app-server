[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-app-server-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "jinja2>=3.1,<4", "pydantic-settings>=2.6,<3", "python-multipart>=0.0.20,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "uvicorn[standard]>=0.32,<1", "websockets>=15,<18", "docker>=7,<8", "llguidance==1.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "openai>=2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
