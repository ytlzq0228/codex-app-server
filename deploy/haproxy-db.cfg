global
    log /dev/log local0
    maxconn 300
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client  1h
    timeout server  1h

# Only Patroni's current primary accepts application writes.
# DB node addresses come from the CODEX_DB_01..03 environment variables of the HAProxy process.
listen codex_primary
    bind 0.0.0.0:5000
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server db-01 "${CODEX_DB_01}:5432" check port 8008
    server db-02 "${CODEX_DB_02}:5432" check port 8008
    server db-03 "${CODEX_DB_03}:5432" check port 8008
