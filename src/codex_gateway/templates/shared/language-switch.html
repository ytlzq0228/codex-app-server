<div class="language-switch" role="radiogroup" aria-label="{{ t('语言') }}">
  <label><input type="radio" name="ui-language" value="CN" data-language-switch aria-label="中文"{% if lang == 'CN' %} checked{% endif %}><span>中</span></label>
  <label><input type="radio" name="ui-language" value="EN" data-language-switch aria-label="English"{% if lang == 'EN' %} checked{% endif %}><span>EN</span></label>
  <span class="language-switch-thumb" aria-hidden="true"></span>
</div>
